<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean Currents &amp; Gyres — Find It on the Map</title>
<style>
  :root{
    --deep:#0E2A3C; --land:#E6DFCE; --arrow:#F0A93B;
    --dotfill:#3FD07E; --ink:#EAF2F6; --dim:#93B6C9; --rule:#33637F;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--deep);color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{position:fixed;inset:0;display:flex;flex-direction:column}

  header{flex:0 0 auto;padding:13px 16px 7px;display:flex;justify-content:center;position:relative;z-index:3}
  #panel{
    background:#F4EEDF;border:1px solid #C6BBA0;border-radius:3px;
    padding:10px 22px 9px;max-width:min(700px,94vw);text-align:center;
    box-shadow:0 6px 26px rgba(0,0,0,.35);
  }
  #ask{
    font-family:Georgia,"Times New Roman",serif;font-style:italic;
    font-size:clamp(17px,2.9vw,28px);line-height:1.2;margin:0;color:#14384F;
  }
  #sub{margin:5px 0 0;font-size:12.5px;color:#6C8494}

  #wrap{flex:1 1 auto;position:relative;min-height:0}
  canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas#c.grabbing{cursor:grabbing}
  canvas#c.target{cursor:pointer}
  canvas#c:focus-visible{outline:2px solid #FFCE7A;outline-offset:-3px}

  footer{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:9px 18px 14px;font-size:13px;position:relative;z-index:3;
  }
  #score{font-variant-numeric:tabular-nums;color:var(--dim)}
  #score strong{color:var(--ink);font-weight:600}
  .spacer{flex:1 1 auto}
  label.tog{display:inline-flex;align-items:center;gap:7px;color:var(--dim);cursor:pointer}
  label.tog input{accent-color:#F0A93B;width:15px;height:15px;cursor:pointer}
  button{
    font:inherit;color:var(--ink);background:transparent;
    border:1px solid var(--rule);border-radius:2px;padding:6px 13px;cursor:pointer;
  }
  button:hover{background:#173C53;border-color:#5A90AE}
  button:focus-visible,label.tog input:focus-visible{outline:2px solid #FFCE7A;outline-offset:2px}

  /* colour wash over the map, map still readable */
  #flash{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity .15s ease-out}
  #flash.on{opacity:1}
  #flash.good{background:rgba(26,150,100,.3)}
  #flash.bad{background:rgba(205,58,42,.32)}

  #fx{position:fixed;inset:0;z-index:9;pointer-events:none}

  #modal{
    position:fixed;inset:0;z-index:11;display:none;
    align-items:flex-end;justify-content:center;padding:20px 20px 5vh;
  }
  #modal.on{display:flex}
  #card{
    border-radius:4px;padding:26px 30px 22px;text-align:center;
    max-width:min(460px,92vw);box-shadow:0 16px 50px rgba(0,0,0,.5);
  }
  #modal.bad #card{background:#B4291A;border:1px solid #E4705F}
  #modal.good #card{background:#F4EEDF;border:1px solid #C6BBA0}
  #headline{
    font-family:Georgia,"Times New Roman",serif;font-style:italic;
    font-size:clamp(26px,5vw,42px);margin:0;line-height:1.1;
  }
  #modal.bad #headline{color:#fff;font-style:normal;letter-spacing:.06em;font-weight:bold}
  #modal.good #headline{color:#14384F}
  #note{margin:9px 0 18px;font-size:14px}
  #modal.bad #note{color:#FFD9D2}
  #modal.good #note{color:#5C7688}
  #acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #modal.bad #acts button{color:#fff;border-color:rgba(255,255,255,.6)}
  #modal.bad #acts button:hover{background:rgba(255,255,255,.15)}
  #modal.good #acts button{color:#14384F;border-color:#B3A78C}
  #modal.good #acts button:hover{background:#E6DDC7}

  @media (prefers-reduced-motion:reduce){#flash{transition:none}}
  @media (max-width:560px){
    header{padding:10px 12px 6px}
    #panel{padding:9px 15px 8px}
    footer{padding:8px 12px 11px;gap:10px;font-size:12px}
    button{padding:6px 10px}
  }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div id="panel">
      <p id="ask">Loading</p>
      <p id="sub">&nbsp;</p>
    </div>
  </header>
  <div id="wrap"><canvas id="c" tabindex="0" aria-label="Map of ocean currents. Drag or use arrow keys to move it."></canvas></div>
  <footer>
    <span id="score"><strong>0</strong> sets cleared</span>
    <span class="spacer"></span>
    <button id="mode">Flat map</button>
    <label class="tog"><input type="checkbox" id="tlabel"> Names</label>
    <button id="bnext">Next set</button>
    <button id="brand">Random set</button>
  </footer>
</div>
<div id="flash"></div>
<canvas id="fx"></canvas>
<div id="modal">
  <div id="card">
    <p id="headline"></p>
    <p id="note"></p>
    <div id="acts">
      <button id="mnext">Next set</button>
      <button id="mrand">Random set</button>
    </div>
  </div>
</div>

/* ---------- maths ---------- */
const D2R=Math.PI/180, R2D=180/Math.PI, TAU=Math.PI*2;
function vecOf(lon,lat){const a=lon*D2R,b=lat*D2R,c=Math.cos(b);return [c*Math.cos(a),c*Math.sin(a),Math.sin(b)];}
function llOf(v){return [Math.atan2(v[1],v[0])*R2D, Math.asin(Math.max(-1,Math.min(1,v[2])))*R2D];}
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function nrm(v){const m=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/m,v[1]/m,v[2]/m];}
function crs(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function slerp(a,b,t){
  const d=Math.max(-1,Math.min(1,dot(a,b))), w=Math.acos(d);
  if(w<1e-9) return a.slice();
  const s=Math.sin(w), k1=Math.sin((1-t)*w)/s, k2=Math.sin(t*w)/s;
  return [a[0]*k1+b[0]*k2, a[1]*k1+b[1]*k2, a[2]*k1+b[2]*k2];
}
function densify(pts, stepDeg, closed){
  const vs=pts.map(p=>vecOf(p[0],p[1]));
  if(closed) vs.push(vs[0]);
  const out=[vs[0]];
  for(let i=0;i<vs.length-1;i++){
    const a=vs[i], b=vs[i+1];
    const ang=Math.acos(Math.max(-1,Math.min(1,dot(a,b))))*R2D;
    const n=Math.max(1,Math.ceil(ang/stepDeg));
    for(let k=1;k<=n;k++) out.push(slerp(a,b,k/n));
  }
  const L=out.length-1;
  if(closed && Math.abs(out[L][0]-out[0][0])<1e-12 && Math.abs(out[L][1]-out[0][1])<1e-12) out.pop();
  return out;
}
function windingOf(pts){
  let t=0;
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    let dl=(b[0]-a[0]+540)%360-180;
    t += dl*D2R*(2+Math.sin(a[1]*D2R)+Math.sin(b[1]*D2R));
  }
  return t>0?1:-1;
}
// continuous longitudes along a path, so nothing jumps the antimeridian
function unwrap(ll){
  const out=[[ll[0][0],ll[0][1]]];
  for(let i=1;i<ll.length;i++){
    let lon=ll[i][0]; const prev=out[i-1][0];
    while(lon-prev>180) lon-=360;
    while(lon-prev<-180) lon+=360;
    out.push([lon,ll[i][1]]);
  }
  return out;
}
function spanOf(ll){
  let lo=Infinity,hi=-Infinity,ls=0;
  for(const p of ll){ if(p[0]<lo)lo=p[0]; if(p[0]>hi)hi=p[0]; ls+=p[1]; }
  return {lo,hi,pole: (hi-lo)>350 ? (ls<0?-90:90) : 0};
}

/* ---------- prebuilt geometry ---------- */
const landRings = LAND.map(r=>{
  const vs=densify(r,4,true);
  const ll=unwrap(vs.map(llOf));
  const sp=spanOf(ll);
  return {vs, n:vs.length, wind:windingOf(r), ll, lo:sp.lo, hi:sp.hi, pole:sp.pole,
          rx:new Float64Array(vs.length), ry:new Float64Array(vs.length),
          rz:new Float64Array(vs.length), vis:new Uint8Array(vs.length)};
});
const currV  = CURRENTS.map(c=>densify(c.pts,1.5,false));
const currLL = currV.map(vs=>{const ll=unwrap(vs.map(llOf)); const sp=spanOf(ll); ll.lo=sp.lo; ll.hi=sp.hi; return ll;});
const dotV   = DOTS.map(d=>vecOf(d.lon,d.lat));
const equatV = (()=>{const o=[];for(let i=0;i<=180;i++)o.push(vecOf(i*2,0));return o;})();
const meridV = (()=>{const s=[];for(let lo=-180;lo<180;lo+=30){const o=[];for(let la=-90;la<=90;la+=3)o.push(vecOf(lo,la));s.push(o);}return s;})();
const paralV = (()=>{const s=[];for(const la of [-60,-30,30,60]){const o=[];for(let i=0;i<=180;i++)o.push(vecOf(i*2,la));s.push(o);}return s;})();

/* ---------- view ---------- */
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let mode="globe";
const view={lam:-155, phi:22};
const flat={lon0:0};
let W=0,H=0,CX=0,CY=0,RAD=0,SC=1,MW=0,MH=0;
let cl=1,sl=0,cp=1,sp=0;

function syncRot(){
  const l=view.lam*D2R, p=view.phi*D2R;
  cl=Math.cos(l); sl=Math.sin(l); cp=Math.cos(p); sp=Math.sin(p);
}
function proj(v){
  const x1=v[0]*cl+v[1]*sl, y1=-v[0]*sl+v[1]*cl, z1=v[2];
  const x2=x1*cp+z1*sp, z2=-x1*sp+z1*cp;
  return {x:CX+RAD*y1, y:CY-RAD*z2, front:x2>0};
}
function unproj(px,py){
  const y2=(px-CX)/RAD, z2=-(py-CY)/RAD, s=y2*y2+z2*z2;
  if(s>1) return null;
  const x2=Math.sqrt(1-s);
  const x1=x2*cp-z2*sp, z1=x2*sp+z2*cp, y1=y2;
  return [x1*cl-y1*sl, x1*sl+y1*cl, z1];
}
// flat map: x from longitude offset, y from latitude
const fxOf=(lon,k)=>CX+(lon-flat.lon0+360*k)*SC;
const fyOf=lat=>CY-lat*SC;
// which 360-degree copies of a path can land inside the frame
function copies(lo,hi){
  const a=Math.floor((-182-(hi-flat.lon0))/360), b=Math.ceil((182-(lo-flat.lon0))/360);
  const out=[]; for(let k=a;k<=b;k++) out.push(k); return out;
}
function resize(){
  const r=cv.getBoundingClientRect();
  const dpr=Math.min(2.5, window.devicePixelRatio||1);
  W=Math.max(1,r.width); H=Math.max(1,r.height);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  CX=W/2; CY=H/2;
  RAD=Math.min(W,H)*0.455;
  SC=Math.min(W/362, H/164); MW=360*SC; MH=160*SC;
  const fc=document.getElementById("fx");
  fc.width=Math.round(window.innerWidth*dpr); fc.height=Math.round(window.innerHeight*dpr);
  fc.getContext("2d").setTransform(dpr,0,0,dpr,0,0);
  draw();
}

/* ---------- land on the globe: clip each ring to the visible hemisphere ---------- */
function landPathGlobe(L){
  const n=L.n, rx=L.rx, ry=L.ry, rz=L.rz, vis=L.vis;
  let nvis=0;
  for(let i=0;i<n;i++){
    const v=L.vs[i];
    const x1=v[0]*cl+v[1]*sl, y1=-v[0]*sl+v[1]*cl, z1=v[2];
    rx[i]=x1*cp+z1*sp; ry[i]=y1; rz[i]=-x1*sp+z1*cp;
    vis[i]= rx[i]>0?1:0; nvis+=vis[i];
  }
  if(nvis===0) return;
  if(nvis===n){
    ctx.moveTo(CX+RAD*ry[0], CY-RAD*rz[0]);
    for(let i=1;i<n;i++) ctx.lineTo(CX+RAD*ry[i], CY-RAD*rz[i]);
    ctx.closePath(); return;
  }
  function cut(i,j){
    const t=rx[i]/(rx[i]-rx[j]);
    let y=ry[i]+t*(ry[j]-ry[i]), z=rz[i]+t*(rz[j]-rz[i]);
    const m=Math.hypot(y,z)||1; return [y/m,z/m];
  }
  let start=-1;
  for(let i=0;i<n;i++){ if(vis[i] && !vis[(i-1+n)%n]){ start=i; break; } }
  if(start<0) return;
  const segs=[]; let cur=null;
  for(let k=0;k<n;k++){
    const i=(start+k)%n, j=(i+1)%n;
    if(vis[i] && !cur){
      const e=cut((i-1+n)%n,i);
      cur={a0:Math.atan2(e[1],e[0]), pts:[CX+RAD*e[0], CY-RAD*e[1]]};
    }
    if(vis[i]) cur.pts.push(CX+RAD*ry[i], CY-RAD*rz[i]);
    if(vis[i] && !vis[j]){
      const e=cut(i,j);
      cur.pts.push(CX+RAD*e[0], CY-RAD*e[1]);
      cur.a1=Math.atan2(e[1],e[0]);
      segs.push(cur); cur=null;
    }
  }
  if(!segs.length) return;
  const dir = L.wind>0 ? -1 : 1;
  const used=new Array(segs.length).fill(false);
  for(let s0=0;s0<segs.length;s0++){
    if(used[s0]) continue;
    let s=s0, first=true;
    for(let guard=0; guard<=segs.length; guard++){
      used[s]=true;
      const p=segs[s].pts;
      if(first){ ctx.moveTo(p[0],p[1]); first=false; } else ctx.lineTo(p[0],p[1]);
      for(let q=2;q<p.length;q+=2) ctx.lineTo(p[q],p[q+1]);
      const a1=segs[s].a1;
      let best=-1,bd=Infinity;
      for(let t=0;t<segs.length;t++){
        let d=((segs[t].a0-a1)*dir)%TAU;
        if(d<0) d+=TAU;
        if(d<1e-12) d=TAU;
        if(d<bd){ bd=d; best=t; }
      }
      ctx.arc(CX,CY,RAD,-a1,-segs[best].a0, dir>0);
      if(best===s0){ ctx.closePath(); break; }
      s=best;
      if(used[s]){ ctx.closePath(); break; }
    }
  }
}
function landPathFlat(L){
  for(const k of copies(L.lo,L.hi)){
    const ll=L.ll;
    ctx.moveTo(fxOf(ll[0][0],k), fyOf(ll[0][1]));
    for(let i=1;i<ll.length;i++) ctx.lineTo(fxOf(ll[i][0],k), fyOf(ll[i][1]));
    if(L.pole){
      ctx.lineTo(fxOf(ll[ll.length-1][0],k), fyOf(L.pole));
      ctx.lineTo(fxOf(ll[0][0],k), fyOf(L.pole));
    }
    ctx.closePath();
  }
}

/* ---------- drawing ---------- */
function strokePath(vsOrLL,color,width,dash,isLL,lo,hi){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap="round"; ctx.lineJoin="round";
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath();
  if(mode==="globe"){
    let pen=false;
    for(const v of vsOrLL){
      const p=proj(v);
      if(p.front){ pen?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); pen=true; } else pen=false;
    }
  }else{
    for(const k of copies(lo,hi)){
      const ll=vsOrLL;
      ctx.moveTo(fxOf(ll[0][0],k), fyOf(ll[0][1]));
      for(let i=1;i<ll.length;i++) ctx.lineTo(fxOf(ll[i][0],k), fyOf(ll[i][1]));
    }
  }
  ctx.stroke(); ctx.restore();
}
const HEAD_AT=[0.36,0.68,1.0];
function arrowHeads(i,color,size){
  if(mode==="globe"){
    const vs=currV[i], n=vs.length;
    for(const f of HEAD_AT){
      const k=Math.min(n-1, Math.max(1, Math.round(f*(n-1))));
      const a=proj(vs[k-1]), b=proj(vs[k]);
      if(a.front && b.front) head(b.x,b.y,Math.atan2(b.y-a.y,b.x-a.x),color,size);
    }
  }else{
    const ll=currLL[i], n=ll.length;
    for(const kk of copies(ll.lo,ll.hi)){
      for(const f of HEAD_AT){
        const q=Math.min(n-1, Math.max(1, Math.round(f*(n-1))));
        const bx=fxOf(ll[q][0],kk), by=fyOf(ll[q][1]);
        const ax=fxOf(ll[q-1][0],kk), ay=fyOf(ll[q-1][1]);
        if(bx<-40||bx>W+40) continue;
        head(bx,by,Math.atan2(by-ay,bx-ax),color,size);
      }
    }
  }
}

function head(x,y,ang,color,size){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(size*1.25,0); ctx.lineTo(-size*0.7,size*0.7);
  ctx.lineTo(-size*0.28,0); ctx.lineTo(-size*0.7,-size*0.7);
  ctx.closePath(); ctx.fillStyle=color; ctx.fill(); ctx.restore();
}
function chartText(s,x,y,fill,px){
  ctx.font="italic "+px+"px Georgia, 'Times New Roman', serif";
  ctx.textAlign="center";
  ctx.lineWidth=3.2; ctx.strokeStyle="rgba(9,30,44,.9)"; ctx.strokeText(s,x,y);
  ctx.fillStyle=fill; ctx.fillText(s,x,y);
}
const wantNames=()=>document.getElementById("tlabel").checked;

// every on-screen position of a dot, so it can be drawn and clicked in both modes
function dotScreens(i){
  if(mode==="globe"){
    const p=proj(dotV[i]);
    return p.front?[[p.x,p.y]]:[];
  }
  const d=DOTS[i], out=[];
  for(const k of copies(d.lon,d.lon)){
    const x=fxOf(d.lon,k);
    if(x>-30&&x<W+30) out.push([x,fyOf(d.lat)]);
  }
  return out;
}

function draw(){
  syncRot();
  ctx.clearRect(0,0,W,H);
  ctx.save();

  if(mode==="globe"){
    const g=ctx.createRadialGradient(CX-RAD*0.3, CY-RAD*0.35, RAD*0.1, CX, CY, RAD);
    g.addColorStop(0,"#26688C"); g.addColorStop(0.7,"#1A4763"); g.addColorStop(1,"#0D2B3E");
    ctx.beginPath(); ctx.arc(CX,CY,RAD,0,TAU); ctx.fillStyle=g; ctx.fill();
    ctx.beginPath(); ctx.arc(CX,CY,RAD,0,TAU); ctx.clip();
  }else{
    ctx.beginPath(); ctx.rect(CX-MW/2, CY-MH/2, MW, MH);
    ctx.fillStyle="#1A4763"; ctx.fill(); ctx.clip();
  }

  if(mode==="globe"){
    for(const m of meridV) strokePath(m,"rgba(126,180,208,.15)",1);
    for(const p of paralV) strokePath(p,"rgba(126,180,208,.15)",1);
  }else{
    ctx.save(); ctx.strokeStyle="rgba(126,180,208,.15)"; ctx.lineWidth=1; ctx.beginPath();
    for(let lon=-180;lon<180;lon+=30) for(const k of copies(lon,lon)){
      const x=fxOf(lon,k); ctx.moveTo(x,CY-MH/2); ctx.lineTo(x,CY+MH/2);
    }
    for(const la of [-60,-30,30,60]){ const y=fyOf(la); ctx.moveTo(CX-MW/2,y); ctx.lineTo(CX+MW/2,y); }
    ctx.stroke(); ctx.restore();
  }

  ctx.beginPath();
  for(const L of landRings){ mode==="globe" ? landPathGlobe(L) : landPathFlat(L); }
  ctx.fillStyle="#E6DFCE"; ctx.fill();
  if(mode!=="globe"){ ctx.strokeStyle="rgba(116,102,76,.6)"; ctx.lineWidth=0.9; ctx.stroke(); }

  // equator
  if(mode==="globe"){
    strokePath(equatV,"rgba(150,215,236,.9)",2,[8,7]);
    const ep=proj(vecOf(view.lam,0));
    if(ep.front) chartText("Equator", ep.x, ep.y-10, "rgba(186,229,244,.95)", 13);
  }else{
    ctx.save(); ctx.strokeStyle="rgba(150,215,236,.9)"; ctx.lineWidth=2; ctx.setLineDash([8,7]);
    ctx.beginPath(); ctx.moveTo(CX-MW/2,fyOf(0)); ctx.lineTo(CX+MW/2,fyOf(0)); ctx.stroke(); ctx.restore();
    chartText("Equator", CX, fyOf(0)-10, "rgba(186,229,244,.95)", 13);
  }

  // currents
  currLL.forEach((ll,i)=>{
    const src = mode==="globe" ? currV[i] : ll;
    strokePath(src,"rgba(10,32,46,.7)",5,null,mode!=="globe",ll.lo,ll.hi);
    strokePath(src,"#F0A93B",2.4,null,mode!=="globe",ll.lo,ll.hi);
    arrowHeads(i,"#F0A93B",5.5);
    if(wantNames()){
      if(mode==="globe"){
        const vis=[];
        for(const v of currV[i]){ const p=proj(v); if(p.front) vis.push(p); }
        if(vis.length){ const m=vis[Math.floor(vis.length/2)]; chartText(CURRENTS[i].short,m.x,m.y-11,"#FFE2B4",12); }
      }else{
        const m=ll[Math.floor(ll.length/2)];
        for(const k of copies(ll.lo,ll.hi)){
          const x=fxOf(m[0],k);
          if(x>-60&&x<W+60) chartText(CURRENTS[i].short,x,fyOf(m[1])-10,"#FFE2B4",12);
        }
      }
    }
  });

  // green dots
  DOTS.forEach((d,i)=>{
    for(const [x,y] of dotScreens(i)){
      ctx.beginPath(); ctx.arc(x,y,7.5,0,TAU);
      ctx.fillStyle="rgba(8,28,20,.55)"; ctx.fill();
      ctx.beginPath(); ctx.arc(x,y,5.2,0,TAU);
      ctx.fillStyle="#3FD07E"; ctx.fill();
      ctx.lineWidth=1.4; ctx.strokeStyle="rgba(240,255,246,.85)"; ctx.stroke();
      if(wantNames()) chartText(d.short, x, y-12, "#B6F2CF", 12);
    }
  });

  // the right answer, shown after a miss
  if(state.reveal){
    const r=state.reveal;
    if(r.kind==="current"){
      const ll=currLL[r.idx], src = mode==="globe" ? currV[r.idx] : ll;
      strokePath(src,"rgba(6,20,30,.9)",9,null,false,ll.lo,ll.hi);
      strokePath(src,"#FFFFFF",3.8,null,false,ll.lo,ll.hi);
      arrowHeads(r.idx,"#FFFFFF",6);
      if(mode==="globe"){
        const vis=[];
        for(const v of currV[r.idx]){ const p=proj(v); if(p.front) vis.push(p); }
        if(vis.length){ const m=vis[Math.floor(vis.length/2)]; chartText(r.label,m.x,m.y-13,"#FFFFFF",13); }
      }else{
        const m=ll[Math.floor(ll.length/2)];
        for(const k of copies(ll.lo,ll.hi)){
          const x=fxOf(m[0],k);
          if(x>-60&&x<W+60) chartText(r.label,x,fyOf(m[1])-12,"#FFFFFF",13);
        }
      }
    }else{
      for(const [x,y] of dotScreens(r.idx)){
        ctx.beginPath(); ctx.arc(x,y,13,0,TAU);
        ctx.lineWidth=3; ctx.strokeStyle="#FFFFFF"; ctx.stroke();
        chartText(DOTS[r.idx].short, x, y-19, "#FFFFFF", 13);
      }
    }
  }

  ctx.restore();
  if(mode==="globe"){
    ctx.beginPath(); ctx.arc(CX,CY,RAD,0,TAU);
    ctx.strokeStyle="rgba(165,210,234,.32)"; ctx.lineWidth=1.5; ctx.stroke();
  }else{
    ctx.beginPath(); ctx.rect(CX-MW/2,CY-MH/2,MW,MH);
    ctx.strokeStyle="rgba(165,210,234,.32)"; ctx.lineWidth=1.5; ctx.stroke();
  }
}

/* ---------- hit testing ---------- */
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, d2=dx*dx+dy*dy;
  if(d2===0) return Math.hypot(px-ax,py-ay);
  let t=((px-ax)*dx+(py-ay)*dy)/d2;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}
function hitTest(px,py){
  if(mode==="globe" && !unproj(px,py)) return null;
  // dots first: they are small explicit markers
  let bestDot=null, dd=16;
  DOTS.forEach((d,i)=>{
    for(const [x,y] of dotScreens(i)){
      const m=Math.hypot(px-x,py-y);
      if(m<dd){ dd=m; bestDot={kind:"dot", idx:i}; }
    }
  });
  if(bestDot) return bestDot;

  let best=null, bestD=Math.max(10, (mode==="globe"?RAD:MW/2)*0.032);
  currLL.forEach((ll,i)=>{
    if(mode==="globe"){
      let prev=null;
      for(const v of currV[i]){
        const p=proj(v);
        if(p.front && prev){
          const m=segDist(px,py,prev.x,prev.y,p.x,p.y);
          if(m<bestD){ bestD=m; best={kind:"current", idx:i}; }
        }
        prev=p.front?p:null;
      }
    }else{
      for(const k of copies(ll.lo,ll.hi)){
        for(let q=1;q<ll.length;q++){
          const ax=fxOf(ll[q-1][0],k), ay=fyOf(ll[q-1][1]);
          const bx=fxOf(ll[q][0],k),   by=fyOf(ll[q][1]);
          if(Math.max(ax,bx)<-30||Math.min(ax,bx)>W+30) continue;
          const m=segDist(px,py,ax,ay,bx,by);
          if(m<bestD){ bestD=m; best={kind:"current", idx:i}; }
        }
      }
    }
  });
  return best;
}

/* ---------- targets and sets ---------- */
const shared={};
CURRENTS.forEach(c=>{ shared[c.name]=(shared[c.name]||0)+1; });
function everyTarget(){
  const seen=new Set(), out=[];
  for(const c of CURRENTS){
    const t = shared[c.name]>1 ? {kind:"current",name:c.name,gyre:c.gyre}
                               : {kind:"current",name:c.name};
    const k=t.kind+"|"+t.name+"|"+(t.gyre||"");
    if(seen.has(k)) continue;
    seen.add(k); out.push(t);
  }
  DOTS.forEach((d,i)=>out.push({kind:"dot",name:d.name,idx:i}));
  return out;
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
const state={bag:[], set:[], step:0, cleared:0, live:false, hover:false, reveal:null};

function drawTarget(){
  if(!state.bag.length) state.bag=shuffle(everyTarget());
  return state.bag.pop();
}
function newSet(randomMode){
  if(randomMode) setMode(Math.random()<0.5?"globe":"flat", false);
  // fresh position every set, so the answer is never in the same place twice
  if(mode==="globe"){
    view.lam=Math.random()*360-180;
    view.phi=Math.round(Math.random()*70-30);
  }else{
    flat.lon0=Math.round(Math.random()*360-180);
  }
  const a=drawTarget();
  let b=drawTarget(), spare=[];
  let guard=0;
  while(b.name===a.name && state.bag.length && guard++<40){
    spare.push(b); b=drawTarget();
  }
  state.bag.push(...spare);
  for(const t of [a,b]){
    if(t.kind==="dot" && DOTS[t.idx].alt) t.useAlt = Math.random()<0.5;
  }
  state.set=[a,b]; state.step=0; state.live=true; state.reveal=null;
  hideModal(); showStep(); draw();
}
function showStep(){
  const t=state.set[state.step];
  const ask=document.getElementById("ask"), sub=document.getElementById("sub");
  const pos=(state.step+1)+" of 2 — ";
  if(t.kind==="dot"){
    const d=DOTS[t.idx];
    if(d.alt){
      ask.textContent = "Find the "+(t.useAlt ? d.alt : d.name+" ("+d.abbr+")");
      sub.textContent = pos+"One dot marks this basin and its gyre.";
    }else{
      ask.textContent = "Find the "+d.name;
      sub.textContent = pos+"Click the green dot.";
    }
  }else if(t.gyre){
    const g=DOTS.find(x=>x.abbr===t.gyre);
    ask.textContent="Find the "+t.name+" in the "+g.name+" ("+g.abbr+")";
    sub.textContent=pos+"This current appears in more than one gyre.";
  }else{
    ask.textContent="Find the "+t.name;
    sub.textContent=pos+(mode==="globe"?"Drag to spin the globe. Click the arrow.":"Drag the map sideways. Click the arrow.");
  }
}
function currIndexOf(t){
  return CURRENTS.findIndex(c=>c.name===t.name && (!t.gyre || c.gyre===t.gyre));
}
function dotLabel(i,useAlt){
  const d=DOTS[i];
  if(!d.alt) return d.name;
  return useAlt ? d.alt : d.name+" ("+d.abbr+")";
}
function nameOfHit(h){
  if(h.kind==="dot") return dotLabel(h.idx,false);
  const c=CURRENTS[h.idx];
  if(shared[c.name]>1){
    const g=DOTS.find(x=>x.abbr===c.gyre);
    return c.name+" in the "+g.name+" ("+g.abbr+")";
  }
  return c.name;
}
function nameOfTarget(t){
  if(t.kind==="dot") return dotLabel(t.idx, !!t.useAlt);
  if(t.gyre){
    const g=DOTS.find(x=>x.abbr===t.gyre);
    return t.name+" in the "+g.name+" ("+g.abbr+")";
  }
  return t.name;
}
function correctFor(t,hit){
  if(t.kind==="dot") return hit.kind==="dot" && hit.idx===t.idx;
  if(hit.kind!=="current") return false;
  const c=CURRENTS[hit.idx];
  return c.name===t.name && (!t.gyre || c.gyre===t.gyre);
}
function wash(kind){
  const f=document.getElementById("flash");
  f.className = kind ? "on "+kind : "";
}
function judge(hit){
  if(!state.live || !hit) return;
  const ok=correctFor(state.set[state.step], hit);
  state.live=false;
  wash(ok?"good":"bad");
  if(!ok){
    const t=state.set[state.step];
    state.reveal = t.kind==="dot" ? {kind:"dot", idx:t.idx}
                                  : {kind:"current", idx:currIndexOf(t), label:CURRENTS[currIndexOf(t)].short};
    draw();
    setTimeout(()=>showModal(false, hit), 420);
    return;
  }
  if(state.step===0){
    setTimeout(()=>{ wash(null); state.reveal=null; state.step=1; state.live=true; showStep(); draw(); }, 700);
  }else{
    state.cleared++;
    document.getElementById("score").innerHTML="<strong>"+state.cleared+"</strong> sets cleared";
    confetti();
    setTimeout(()=>showModal(true), 500);
  }
}

/* ---------- modal ---------- */
function showModal(good,hit){
  const m=document.getElementById("modal");
  document.getElementById("headline").textContent = good ? "Both correct" : "TRY AGAIN";
  document.getElementById("note").textContent = good
    ? "Would you like another set?"
    : "You clicked the "+nameOfHit(hit)+". The answer was the "
      +nameOfTarget(state.set[state.step])+", now marked in white.";
  m.className="on "+(good?"good":"bad");
  document.getElementById("mnext").focus();
}
function hideModal(){ document.getElementById("modal").className=""; wash(null); }

/* ---------- confetti ---------- */
const fx=document.getElementById("fx"), fxc=fx.getContext("2d");
let bits=[], fxRun=false;
const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(){
  if(reduce) return;
  const cols=["#3FD07E","#F0A93B","#7FD4F0","#F4EEDF","#E86A4E"];
  bits=[];
  const w=window.innerWidth;
  for(let i=0;i<130;i++){
    bits.push({x:Math.random()*w, y:-20-Math.random()*window.innerHeight*0.5,
      vx:(Math.random()-0.5)*1.1, vy:2+Math.random()*2.6,
      w:5+Math.random()*6, h:8+Math.random()*7,
      r:Math.random()*TAU, vr:(Math.random()-0.5)*0.22,
      c:cols[(Math.random()*cols.length)|0]});
  }
  if(!fxRun){ fxRun=true; tick(); }
}
function tick(){
  const w=window.innerWidth, h=window.innerHeight;
  fxc.clearRect(0,0,w,h);
  let alive=0;
  for(const b of bits){
    b.x+=b.vx; b.y+=b.vy; b.vy+=0.045; b.r+=b.vr;
    if(b.y<h+30){
      alive++;
      fxc.save(); fxc.translate(b.x,b.y); fxc.rotate(b.r);
      fxc.fillStyle=b.c; fxc.fillRect(-b.w/2,-b.h/2,b.w,b.h); fxc.restore();
    }
  }
  if(alive){ requestAnimationFrame(tick); }
  else { fxc.clearRect(0,0,w,h); fxRun=false; }
}

/* ---------- input ---------- */
let drag=null;
cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId);
  drag={x:e.offsetX,y:e.offsetY,lam:view.lam,phi:view.phi,lon0:flat.lon0,moved:0};
  cv.classList.add("grabbing");
});
cv.addEventListener("pointermove",e=>{
  if(drag){
    const dx=e.offsetX-drag.x, dy=e.offsetY-drag.y;
    drag.moved=Math.max(drag.moved,Math.hypot(dx,dy));
    if(mode==="globe"){
      const k=86/RAD;
      view.lam=drag.lam-dx*k;
      view.phi=Math.max(-89,Math.min(89,drag.phi+dy*k));
    }else{
      flat.lon0=((drag.lon0-dx/SC+180)%360+360)%360-180;
    }
    draw();
  }else{
    syncRot();
    const h=hitTest(e.offsetX,e.offsetY);
    if(!!h!==state.hover){ state.hover=!!h; cv.classList.toggle("target",!!h); }
  }
});
cv.addEventListener("pointerup",e=>{
  cv.classList.remove("grabbing");
  const click = drag && drag.moved<6;
  drag=null;
  if(click){ syncRot(); judge(hitTest(e.offsetX,e.offsetY)); }
});
cv.addEventListener("pointercancel",()=>{drag=null;cv.classList.remove("grabbing");});
cv.addEventListener("keydown",e=>{
  const step=e.shiftKey?14:6; let used=true;
  if(e.key==="ArrowLeft"){ mode==="globe"?view.lam+=step:flat.lon0=((flat.lon0-step+180)%360+360)%360-180; }
  else if(e.key==="ArrowRight"){ mode==="globe"?view.lam-=step:flat.lon0=((flat.lon0+step+180)%360+360)%360-180; }
  else if(e.key==="ArrowUp" && mode==="globe") view.phi=Math.min(89,view.phi+step);
  else if(e.key==="ArrowDown" && mode==="globe") view.phi=Math.max(-89,view.phi-step);
  else used=false;
  if(used){ e.preventDefault(); draw(); }
});

function setMode(m,redraw){
  mode=m;
  document.getElementById("mode").textContent = m==="globe" ? "Flat map" : "Globe";
  if(m==="globe"){ view.lam=Math.random()*360-180; view.phi=Math.round(Math.random()*70-30); }
  else flat.lon0=Math.round(Math.random()*360-180);
  if(redraw!==false){ showStep(); draw(); }
}
document.getElementById("mode").addEventListener("click",()=>setMode(mode==="globe"?"flat":"globe",true));
document.getElementById("tlabel").addEventListener("change",draw);
document.getElementById("bnext").addEventListener("click",()=>newSet(false));
document.getElementById("brand").addEventListener("click",()=>newSet(true));
document.getElementById("mnext").addEventListener("click",()=>newSet(false));
document.getElementById("mrand").addEventListener("click",()=>newSet(true));
window.addEventListener("resize",resize);

state.bag=shuffle(everyTarget());
newSet(false);
resize();
</script>
</body>
